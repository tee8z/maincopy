[package]
name = "maincopy-diagram-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Supervised Mermaid rendering helper and client for Maincopy"
readme = "README.md"
autobins = false

[features]
default = ["client", "helper"]
client = ["dep:rustix", "dep:tempfile", "rustix/event", "rustix/process"]
helper = ["dep:mermaid-rs-renderer", "dep:rustix", "rustix/process"]

[[bin]]
name = "maincopy-mermaid"
path = "src/main.rs"
required-features = ["helper"]

[dependencies]
mermaid-rs-renderer = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
blake3.workspace = true
