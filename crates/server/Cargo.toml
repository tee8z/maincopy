[package]
name = "maincopy-server"
version.workspace = true
edition.workspace = true
autobins = false

[[bin]]
name = "maincopyd"
path = "src/main.rs"

[dependencies]
arc-swap.workspace = true
axum.workspace = true
blake3.workspace = true
clap.workspace = true
lexe.workspace = true
lightning-invoice.workspace = true
libsqlite3-sys.workspace = true
maincopy-shared = { workspace = true, features = ["schema"] }
maud.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt"] }
utoipa = { workspace = true, features = ["axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true, default-features = false, features = ["alloc"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }

[features]
test-utils = []

[build-dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
lightningcss.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.build-dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[dev-dependencies]
bitcoin.workspace = true
lightningcss.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { workspace = true, features = ["fs", "std"] }
