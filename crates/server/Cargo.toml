[package]
name = "maincopy-server"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "maincopyd"
path = "src/main.rs"

[[bin]]
name = "maincopy-ssh"
path = "src/bin/maincopy_ssh.rs"

[dependencies]
arc-swap.workspace = true
argon2.workspace = true
axum.workspace = true
base64.workspace = true
bech32 = { workspace = true, features = ["std"] }
blake3.workspace = true
clap.workspace = true
getrandom.workspace = true
libsqlite3-sys.workspace = true
k256.workspace = true
maincopy-diagram-renderer = { workspace = true, features = ["client"] }
maincopy-shared = { workspace = true, features = ["schema"] }
markdown-compiler.workspace = true
maud.workspace = true
pulldown-cmark.workspace = true
qrcode.workspace = true
quick-xml.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, default-features = false, features = ["fmt"] }
utoipa = { workspace = true, features = ["axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true, default-features = false, features = ["alloc"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs", "process", "std"] }

[build-dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
lightningcss.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.build-dependencies]
rustix = { workspace = true, features = ["fs", "std"] }

[dev-dependencies]
lightningcss.workspace = true
mermaid-rs-renderer.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { workspace = true, features = ["fs", "std"] }
