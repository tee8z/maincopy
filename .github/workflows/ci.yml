name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nix:
    name: Nix checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9

      # The Nix store, keyed on what changes the dependency builds. Only a
      # push to master saves it; pull requests and releases restore it.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', 'flake.nix', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Report Nix evaluation settings
        run: |
          nix --version
          nix config show eval-cores
          nix config show max-call-depth

      - name: Allow the Nix test sandbox to create user namespaces
        run: |
          # Ubuntu's packaged profiles do not cover Bubblewrap in the Nix store.
          sudo tee /etc/apparmor.d/maincopy-nix-bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile maincopy-nix-bwrap /nix/store/*-bubblewrap-*/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/maincopy-nix-bwrap

      - name: Run flake checks
        run: nix flake check --print-build-logs

      - name: Verify release signatures, checksums, and interrupted publication
        run: nix develop --no-update-lock-file --command python3 scripts/release_test.py

      - name: Build Maincopy
        run: nix build --print-build-logs

  windows:
    name: Windows client checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Test shared contracts and CLI
        run: cargo test --locked --package maincopy-shared --package maincopy-cli --all-targets
