name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to prepare or retry
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: candidate

# Publication is never cancelled halfway through a dependency chain.
concurrency:
  group: maincopy-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_GPG_PUBLIC_KEY: ${{ vars.RELEASE_GPG_PUBLIC_KEY }}
  RELEASE_GPG_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
  CARGO_BUILD_JOBS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    name: Verify signed source and prepare all five crates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted automation from the dispatched master revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the candidate without executing it
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, signer, commit, and versions
        run: python3 ../automation/scripts/release.py verify-tag --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/identity.json"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@83293488abfd33fbfb2ab084097467491c029962 # v3.22.2
        with:
          use-gha-cache: enabled
          diagnostic-endpoint: ''
      - name: Test release boundaries with the locked Cargo toolchain
        run: nix develop --no-update-lock-file --command python3 ../automation/scripts/release_test.py
      - name: Prepare source, verified crate archives, and Rust inventory
        run: |
          nix develop --no-update-lock-file --command python3 ../automation/scripts/release.py prepare \
            --identity "$RUNNER_TEMP/identity.json" \
            --output "$RUNNER_TEMP/prepared" \
            --target-dir "$RUNNER_TEMP/cargo-prepare"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-prepared
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
          retention-days: 30

  nix:
    if: github.ref == 'refs/heads/master'
    name: Nix checks (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: [self-hosted, linux, ARM64, maincopy-release-kvm]
    steps:
      - name: Check out trusted automation from the dispatched master revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the candidate without executing it
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed source
        run: python3 ../automation/scripts/release.py verify-tag --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/identity.json"
      - name: Verify native architecture and working KVM access
        env:
          RELEASE_SYSTEM: ${{ matrix.system }}
        run: |
          python3 - "$RELEASE_SYSTEM" <<'PY'
          import fcntl
          import platform
          import sys

          expected = {"x86_64-linux": "x86_64", "aarch64-linux": "aarch64"}[sys.argv[1]]
          if platform.machine() != expected:
              raise SystemExit("Runner architecture does not match the required Nix system")
          try:
              with open("/dev/kvm", "r+b", buffering=0) as device:
                  # Linux KVM_GET_API_VERSION is available on both architectures.
                  if fcntl.ioctl(device.fileno(), 0xAE00) != 12:
                      raise SystemExit("Runner does not expose supported KVM API version 12")
          except OSError as error:
              raise SystemExit(f"Runner cannot access working /dev/kvm: {error.strerror}") from None
          print(f"Runner preflight passed: {sys.argv[1]}, KVM API 12")
          PY
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@83293488abfd33fbfb2ab084097467491c029962 # v3.22.2
        with:
          use-gha-cache: enabled
          diagnostic-endpoint: ''
      - name: Verify Nix advertises the required VM builder features
        run: |
          release_features=" $(nix config show system-features) "
          for release_feature in kvm nixos-test; do
            if [[ "$release_features" != *" $release_feature "* ]]; then
              printf 'Nix builder lacks required feature: %s\n' "$release_feature" >&2
              exit 1
            fi
          done
      - name: Permit the existing Bubblewrap test sandbox
        run: |
          sudo tee /etc/apparmor.d/maincopy-nix-bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile maincopy-nix-bwrap /nix/store/*-bubblewrap-*/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/maincopy-nix-bwrap
      - name: Check and build the committed source archive
        env:
          RELEASE_SYSTEM: ${{ matrix.system }}
        run: |
          mkdir "$RUNNER_TEMP/release-source" "$RUNNER_TEMP/nix-inventory"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/release-source"
          nix flake check --no-update-lock-file --print-build-logs "path:$RUNNER_TEMP/release-source"
          nix build --no-update-lock-file --no-link --print-out-paths --print-build-logs \
            "path:$RUNNER_TEMP/release-source#packages.$RELEASE_SYSTEM.default" > "$RUNNER_TEMP/nix-output"
          release_output="$(cat "$RUNNER_TEMP/nix-output")"
          python3 ../automation/scripts/release.py nix-inventory --output-path "$release_output" \
            --system "$RELEASE_SYSTEM" --output "$RUNNER_TEMP/nix-inventory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-nix-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-inventory/
          if-no-files-found: error
          retention-days: 30

  candidate:
    if: github.ref == 'refs/heads/master'
    name: Seal candidate checksums for review
    needs: [prepare, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted automation from the dispatched master revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the candidate without executing it
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Verify identity and seal the complete candidate
        run: |
          python3 ../automation/scripts/release.py verify-tag --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/identity.json"
          python3 ../automation/scripts/release.py seal --artifacts "$RUNNER_TEMP/candidate"
          python3 ../automation/scripts/release.py check --artifacts "$RUNNER_TEMP/candidate"
          cat "$RUNNER_TEMP/candidate/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref == 'refs/heads/master'
    name: Publish crates and complete GitHub Release after approval
    needs: candidate
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted automation from the dispatched master revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: automation
          persist-credentials: false
      - name: Check out the candidate without executing it
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - name: Reverify signed identity and reviewed bytes
        run: |
          python3 ../automation/scripts/release.py verify-tag --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/identity.json"
          python3 ../automation/scripts/release.py check --artifacts "$RUNNER_TEMP/candidate"
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - uses: DeterminateSystems/flakehub-cache-action@83293488abfd33fbfb2ab084097467491c029962 # v3.22.2
        with:
          use-gha-cache: enabled
          diagnostic-endpoint: ''
      - name: Publish missing versions with Cargo checksum authorization
        env:
          MAINCOPY_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          nix develop --no-update-lock-file --command python3 ../automation/scripts/release.py publish-crates \
            --artifacts "$RUNNER_TEMP/candidate" --target-dir "$RUNNER_TEMP/cargo-publish"
      - name: Upload matching draft assets and publish GitHub Release last
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../automation/scripts/release.py publish-github --artifacts "$RUNNER_TEMP/candidate"
