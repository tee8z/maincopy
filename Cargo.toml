[workspace]
members = ["crates/cli", "crates/server", "crates/shared"]
default-members = ["crates/cli", "crates/server", "crates/shared"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "maincopy-workspace"

[workspace.dependencies]
arc-swap = { version = "=1.9.2", default-features = false }
axum = "0.8.9"
bitcoin = "0.32.102"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
lexe = "=0.1.22"
lightning-invoice = { version = "0.34.0", features = ["std"] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled"] }
maincopy-shared = { path = "crates/shared" }
maud = { version = "=0.27.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
rustix = { version = "=1.1.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = "1.53.1"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
uuid = "1.26.0"
windows-sys = { version = "=0.61.2", default-features = false }
zeroize = { version = "=1.9.0", default-features = false }
