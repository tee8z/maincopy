[package]
name = "maincopy"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = { version = "=1.9.2", default-features = false }
axum = "0.8.9"
blake3 = "1.8.3"
clap = { version = "4.6.6", features = ["derive"] }
lexe = "=0.1.22"
lightning-invoice = { version = "0.34.0", features = ["std"] }
maud = { version = "=0.27.0", default-features = false }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.2.0"
url = "2.5.8"
uuid = { version = "1.26.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[features]
test-utils = []

[build-dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.build-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
bitcoin = "0.32.102"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
serde_json = "1.0.151"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
