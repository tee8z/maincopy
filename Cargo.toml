[package]
name = "maincopy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
lexe = "=0.1.22"
lightning-invoice = { version = "0.34.0", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.26.0", features = ["v4"] }

[features]
test-utils = []

[dev-dependencies]
bitcoin = "0.32.102"
serde_json = "1.0.151"
tower = { version = "0.5.3", features = ["util"] }
