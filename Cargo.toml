[workspace]
members = [
    "crates/cli",
    "crates/markdown-compiler",
    "crates/server",
    "crates/shared",
]
default-members = [
    "crates/cli",
    "crates/markdown-compiler",
    "crates/server",
    "crates/shared",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.metadata.crane]
name = "maincopy-workspace"

[workspace.dependencies]
arc-swap = { version = "=1.9.2", default-features = false }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash", "zeroize"] }
axum = "0.8.9"
base64 = "=0.22.1"
bech32 = { version = "=0.11.1", default-features = false, features = ["alloc"] }
blake3 = "1.8.3"
bytes = "=1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = { version = "=0.4.3", default-features = false }
lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
libsqlite3-sys = { version = "=0.37.0", default-features = false, features = ["bundled"] }
maincopy-shared = { path = "crates/shared" }
markdown-compiler = { path = "crates/markdown-compiler" }
maud = { version = "=0.27.0", default-features = false }
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
qrcode = { version = "=0.14.1", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false }
rpassword = "=7.5.4"
rustix = { version = "=1.1.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "=0.10.9", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = { version = "=2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = "1.53.1"
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
utoipa = "5.5.0"
utoipa-axum = "0.2.0"
uuid = "1.26.0"
zeroize = { version = "=1.9.0", default-features = false }
